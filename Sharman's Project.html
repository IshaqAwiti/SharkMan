<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharman's Project</title>
<meta name="theme-color" content="#0b2a3f">
<style>
:root{
  --ink:#172b3a; --ink2:#44596b; --ink3:#7a8b99; --line:#dfe6ec; --paper:#fff; --list:#eef2f5;
  --accent:#0e8a8a; --accent-d:#0a6b6b; --warn:#c77700; --bad:#c23b3b; --good:#1f8a4c;
  --r:10px; --sh:0 1px 2px rgba(10,30,45,.18);
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --hue:205;
}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(135deg,hsl(var(--hue) 62% 30%),hsl(calc(var(--hue) + 40) 55% 24%));background-attachment:fixed;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(6,24,38,.55);backdrop-filter:blur(8px);color:#fff;flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:8px;background:#fff;display:grid;place-items:center;color:#0b2a3f}
.brand .logo svg{width:18px;height:18px;stroke-width:2.2}
.spacer{flex:1}
.tbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;height:34px;min-width:34px;padding:0 10px;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{background:rgba(255,255,255,.26)}
.search{position:relative}
.search input{height:34px;border-radius:8px;border:0;background:rgba(255,255,255,.16);color:#fff;padding:0 10px 0 32px;width:200px}
.search input::placeholder{color:rgba(255,255,255,.7)}
.search svg{position:absolute;left:9px;top:8px;width:17px;height:17px;color:#fff}
.search input:focus{outline:2px solid #fff;background:rgba(255,255,255,.25)}
.results{position:absolute;right:0;top:40px;width:340px;max-height:60vh;overflow:auto;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:30}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--line)}
.results button:hover{background:var(--list)}
.results small{color:var(--ink3);display:block}

/* tabs */
.tabs{display:flex;gap:4px;padding:8px 14px 0;overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:7px 13px;white-space:nowrap;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.tab:hover{background:rgba(255,255,255,.26)}
.tab.on{background:#fff;color:var(--ink)}
.tab .n{font-size:11px;background:rgba(0,0,0,.18);border-radius:10px;padding:0 6px;font-weight:700}
.tab.on .n{background:var(--list);color:var(--ink2)}

.stage{flex:1;min-height:0;position:relative}
.boardhead{display:flex;align-items:center;gap:12px;padding:12px 14px 4px;color:#fff;flex-wrap:wrap}
.boardhead h1{margin:0;font-size:19px}
.boardhead .sub{opacity:.85;font-size:13px}
.board{position:absolute;inset:44px 0 0 0;display:flex;gap:10px;padding:8px 14px 80px;overflow-x:auto;align-items:flex-start}
.list{width:288px;flex:none;background:var(--list);border-radius:12px;max-height:100%;display:flex;flex-direction:column;box-shadow:var(--sh)}
.lh{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 12px}
.lh h3{margin:0;font-size:14px;flex:1;cursor:text}
.lh .cnt{font-size:12px;color:var(--ink3);font-weight:600}
.lh .done-mark{color:var(--good)}
.iconbtn{border:0;background:none;border-radius:6px;width:28px;height:28px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:rgba(0,0,0,.08)}
.cards{overflow-y:auto;padding:2px 8px 4px;display:flex;flex-direction:column;gap:7px;min-height:12px}
.cards.over{background:rgba(14,138,138,.12);border-radius:8px}
.card{background:var(--paper);border-radius:9px;padding:9px 10px;box-shadow:var(--sh);cursor:pointer;position:relative;border:2px solid transparent}
.card:hover{border-color:rgba(14,138,138,.45)}
.card.dragging{opacity:.4}
.card.isdone .ct{color:var(--ink3);text-decoration:line-through}
.crow{display:flex;gap:8px;align-items:flex-start}
.chk{width:18px;height:18px;border-radius:50%;border:2px solid #b8c4ce;background:#fff;flex:none;margin-top:1px;display:grid;place-items:center;padding:0}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.chk svg{width:11px;height:11px;stroke-width:3.4;display:none}
.chk.on svg{display:block}
.ct{font-weight:600;flex:1;word-break:break-word}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.chip{font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;color:#fff;line-height:18px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);background:var(--list);border-radius:6px;padding:1px 7px;font-weight:600}
.badge svg{width:12px;height:12px}
.badge.late{background:var(--bad);color:#fff}.badge.soon{background:#fbe4b8;color:#6b4300}.badge.ok{background:#d6f0e0;color:#14673a}
.bar{height:6px;background:var(--list);border-radius:4px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.green i{background:var(--good)}
.amt{font-size:15px;font-weight:700;margin-top:6px;display:flex;justify-content:space-between;align-items:baseline}
.amt small{font-weight:500;color:var(--ink3);font-size:12px}
.add{margin:2px 8px 8px;border:0;background:none;text-align:left;padding:7px 8px;border-radius:8px;color:var(--ink2);display:flex;gap:6px;align-items:center;font-weight:600}
.add:hover{background:rgba(0,0,0,.07)}
.composer{margin:2px 8px 8px}
.composer textarea,.newlist input{width:100%;border:2px solid var(--accent);border-radius:8px;padding:8px;resize:none;font-weight:600;background:#fff}
.composer .row{display:flex;gap:6px;margin-top:6px;align-items:center}
.newlist{width:288px;flex:none;background:rgba(255,255,255,.22);border-radius:12px;padding:10px;color:#fff}
.newlist button.ghost{width:100%;background:none;border:0;color:#fff;text-align:left;font-weight:600;display:flex;gap:6px;align-items:center;padding:2px}
.newlist input{color:var(--ink)}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:700;background:var(--list);color:var(--ink)}
.btn:hover{filter:brightness(.95)}
.btn.p{background:var(--accent);color:#fff}.btn.p:hover{background:var(--accent-d);filter:none}
.btn.d{background:#fbe3e3;color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}

/* panels (home, money) */
.panel{position:absolute;inset:0;overflow-y:auto;padding:14px 14px 100px}
.wrap{max-width:1100px;margin:0 auto}
.hello{color:#fff;margin:2px 0 14px}
.hello h1{margin:0;font-size:22px}.hello p{margin:3px 0 0;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:var(--paper);border-radius:12px;padding:14px;box-shadow:var(--sh);text-align:left;border:0;display:block;width:100%}
button.tile:hover{outline:2px solid var(--accent)}
.tile .k{font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
.tile .v{font-size:26px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--ink2)}
.v.bad{color:var(--bad)}.v.good{color:var(--good)}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;margin-top:12px}
.sec{min-width:0;background:var(--paper);border-radius:12px;padding:14px;box-shadow:var(--sh)}
.sec h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.row-item{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:0}
.row-item:hover{background:var(--list)}
.row-item .grow{flex:1;min-width:0}
.row-item .grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item .grow small{color:var(--ink3)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.empty{color:var(--ink3);padding:14px 4px;text-align:center}
.catbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.catbar .nm{width:110px;font-weight:600}
.catbar .tr{flex:1;height:9px;background:var(--list);border-radius:5px;overflow:hidden}
.catbar .tr i{display:block;height:100%;border-radius:5px}
.catbar .vv{width:72px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.monthnav{display:flex;align-items:center;gap:8px;color:#fff;margin-bottom:12px;flex-wrap:wrap}
.monthnav h1{margin:0;font-size:20px;min-width:150px;text-align:center}
.seg{display:inline-flex;background:rgba(255,255,255,.18);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:#fff;padding:5px 11px;border-radius:6px;font-weight:600}
.seg button.on{background:#fff;color:var(--ink)}
.txday{font-size:12px;font-weight:700;color:var(--ink3);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.4px}
.txamt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.txamt.in{color:var(--good)}

/* fab */
.fab{position:fixed;right:18px;bottom:18px;height:54px;border-radius:27px;border:0;background:#fff;color:var(--accent-d);box-shadow:0 6px 18px rgba(0,0,0,.35);padding:0 20px 0 16px;font-weight:800;display:flex;align-items:center;gap:8px;z-index:20}
.fab svg{width:22px;height:22px;stroke-width:2.6}
.fab:hover{background:var(--list)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,20,30,.6);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;z-index:50}
.modal{background:#f6f8fa;border-radius:14px;width:100%;max-width:640px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);position:relative}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .x{position:absolute;right:10px;top:10px}
.titlein{width:100%;border:2px solid transparent;background:transparent;font-size:18px;font-weight:700;padding:5px 8px;border-radius:8px;margin-left:-8px}
.titlein:hover{background:#e9eef2}.titlein:focus{background:#fff;border-color:var(--accent);outline:0}
.f{margin:12px 0}
.f>label,.lab{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.f input,.f select,.f textarea,.inp{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{outline:0;border-color:var(--accent)}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cli{display:flex;align-items:center;gap:8px;padding:4px 0}
.cli input[type=text]{flex:1;border:0;background:none;padding:4px 6px;border-radius:6px}
.cli input[type=text]:hover,.cli input[type=text]:focus{background:#fff;outline:0}
.cli.d input[type=text]{text-decoration:line-through;color:var(--ink3)}
.pickchip{border:2px solid transparent;border-radius:14px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff;margin:0 4px 4px 0}
.pickchip.off{opacity:.35}
.tag-row{display:flex;flex-wrap:wrap}
.pays{background:#fff;border-radius:8px;border:1.5px solid var(--line);padding:4px 10px;margin-top:6px}
.pays .p{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.pays .p:last-child{border:0}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-weight:600;font-size:13px}
.catpick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bigamt{font-size:34px;font-weight:800;text-align:center;border:0!important;background:#fff;border-radius:12px!important;padding:12px!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-weight:600;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.menu{position:fixed;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:6px;z-index:60;min-width:170px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font-weight:600}
.menu button:hover{background:var(--list)}
.hint{font-size:12.5px;color:var(--ink3)}
.saved{font-size:12px;opacity:.85}

@media(max-width:760px){
  .cols{grid-template-columns:1fr}
  .search input{width:120px}
  .list{width:82vw}
  .newlist{width:82vw}
  .brand span.t{display:none}
  .results{position:fixed;left:10px;right:10px;width:auto;top:52px}
  .two,.three{grid-template-columns:1fr 1fr}
  .tile .v{font-size:20px}.grid{grid-template-columns:1fr 1fr;gap:8px}.tile{padding:11px}
  .fab span{display:none}.fab{padding:0 16px;height:56px;width:56px;border-radius:28px;justify-content:center}
  .catbar .nm{width:90px}
}
@media(prefers-reduced-motion:no-preference){.card,.tile{transition:outline-color .12s,border-color .12s}}
</style>
</head>

let S, view='home', storageOK=true, monthOff=0, txFilter='all', q='';
function load(){
  try{const r=localStorage.getItem(KEY); if(r){S=JSON.parse(r)}}catch(e){storageOK=false}
  if(!S)S=JSON.parse(JSON.stringify(SEED));
  migrate();rollShifts();
}
function migrate(){
  if((S.v||1)>=SEED.v)return;
  const P=JSON.parse(JSON.stringify(SEED.patch));
  for(const b of P.boards)if(!S.boards.find(x=>x.id===b.id))S.boards.push(b);
  for(const c of P.cards)if(!S.cards.find(x=>x.id===c.id)&&S.boards.find(b=>b.id===c.b)){
    const b=S.boards.find(x=>x.id===c.b);
    if(!b.lists.find(l=>l.id===c.l)){const sl=SEED.boards.find(x=>x.id===c.b).lists.find(l=>l.id===c.l);if(sl)b.lists.push(sl)}
    S.cards.push(c)}
  S.v=SEED.v;save();
}
/* a booked shift whose date has passed moves itself to Shift done */
function rollShifts(){
  const b=S.boards.find(x=>x.id==='jobs');if(!b)return;
  const bk=b.lists.find(l=>l.name==='Shift booked'),dn=b.lists.find(l=>l.name==='Shift done');if(!bk||!dn)return;
  let ch=false;
  for(const c of S.cards)if(c.b==='jobs'&&c.l===bk.id&&c.due&&c.f.jtype==='Shift'&&c.due<today()){c.l=dn.id;c.done=true;ch=true}
  if(ch)save();
}

  clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}},120);

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayDiff=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const rateOf=c=>c==='EUR'?1:c==='KES'?S.settings.rate:c==='USD'?1.14:c==='GBP'?0.844:1;
const toEUR=(a,c)=>(+a||0)/rateOf(c||'EUR');
const fmt=(n,d=2)=>(+n).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=n=>(n<0?'-':'')+'€'+fmt(Math.abs(n));
const money=(a,c)=>c==='EUR'||!c?eur(a):(c==='KES'?'KSh ':c+' ')+fmt(a,0);
const fmtDate=iso=>iso?new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const fmtShort=iso=>iso?new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';

const debtLeft=c=>Math.max(0,(+c.f.amount||0)+(+c.f.extra||0)-(c.f.pays||[]).reduce((s,p)=>s+(+p.amt||0),0));
function isDone(c){return !!c.done}
function dueBadge(c){
  if(!c.due)return '';
  const d=dayDiff(c.due);
  if(c.done)return `<span class="badge">${I.cal}${fmtShort(c.due)}</span>`;
  const cls=d<0?'late':d<=3?'soon':'';
  const txt=d<0?`${-d}d overdue`:d===0?'Today':d===1?'Tomorrow':fmtShort(c.due);
  return `<span class="badge ${cls}">${I.cal}${txt}</span>`;
}
function relDue(c){const d=dayDiff(c.due);return d<0?`${-d} day${d===-1?'':'s'} overdue`:d===0?'Today':d===1?'Tomorrow':`In ${d} days`}

/* ---------- derived numbers ---------- */
function monthKey(off=0){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthTx(off){const k=monthKey(off);return S.tx.filter(t=>t.date.startsWith(k))}
function totals(list){
  let inn=0,out=0,pin=0,pout=0;
  for(const t of list){const e=toEUR(t.amt,t.cur);
    if(t.status==='Paid'){t.type==='in'?inn+=e:out+=e}else{t.type==='in'?pin+=e:pout+=e}}
  return{inn,out,pin,pout};
}
function cash(){let c=+S.settings.opening||0;for(const t of S.tx){if(t.status!=='Paid')continue;const e=toEUR(t.amt,t.cur);c+=t.type==='in'?e:-e}return c}
function debtTotals(){let eurLeft=0,open=0,paid=0;for(const c of cardsOf('debts')){const l=debtLeft(c);eurLeft+=toEUR(l,c.f.cur);if(l>0)open++;paid+=toEUR((c.f.pays||[]).reduce((s,p)=>s+(+p.amt||0),0),c.f.cur)}return{eurLeft,open,paid}}
function weekStart(){const d=new Date();const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function funMin(c){const w=weekStart();return (c.f.sessions||[]).filter(s=>s.date>=w).reduce((a,s)=>a+(+s.min||0),0)}
function funWeek(){let m=0,bud=0;for(const c of cardsOf('fun')){m+=funMin(c);bud+=(+c.f.budget||0)}return{m,bud}}
const hm=m=>m>=60?`${Math.floor(m/60)} h ${m%60?String(Math.round(m%60)).padStart(2,'0')+' min':''}`.trim():`${Math.round(m)} min`;
function workStats(){
  const days=new Set();let hrsDone=0,hrsBooked=0,gross=0;
  for(const c of cardsOf('jobs')){if(c.f.jtype!=='Shift')continue;
    const lst=B('jobs').lists.find(l=>l.id===c.l);
    const booked=lst&&lst.name==='Shift booked', done=lst&&lst.name==='Shift done';
    if(!(booked||done))continue;
    if(c.due)days.add(c.due);
    const h=+c.f.hours||0; done?hrsDone+=h:hrsBooked+=h; gross+=h*(+c.f.wage||0);
  }
  return{days:days.size,hrsDone,hrsBooked,gross};
}

function catBars(list,type){

  const k=b.kind,f=c.f;let body='',chk=true;
  if(k==='debt'){chk=false;const left=debtLeft(c),tot=(+f.amount||0)+(+f.extra||0),p=tot?(tot-left)/tot*100:0;

  if(k==='goal'){chk=false;const p=f.target?Math.min(100,(+f.saved||0)/f.target*100):0;
    body=`<div class="amt"><span>${eur(+f.saved||0)}</span><small>of ${f.target?eur(f.target):'no target'}</small></div><div class="bar ${p>=100?'green':''}"><i style="width:${p}%"></i></div>`;}
  if(k==='job'&&f.jtype==='Shift'){const est=(+f.hours||0)*(+f.wage||0);body=`<div class="meta">${f.hours?`<span class="badge">${f.hours} h</span>`:''}${f.wage?`<span class="badge">€${f.wage}/h</span>`:''}${est?`<span class="badge ok">≈ ${eur(est)}</span>`:''}</div>`}
  if(k==='bill'&&f.amount){body=`<div class="amt"><span>${money(f.amount,f.cur)}</span><small>${f.cur!=='EUR'?'≈ '+eur(toEUR(f.amount,f.cur)):''}</small></div>`}
  if(k==='fun'){chk=false;const m=funMin(c),bud=(+f.budget||0)*60;
    body=`<div class="amt"><span>${hm(m)}</span><small>${bud?'of '+f.budget+' h this week':'this week'}</small></div>${bud?`<div class="bar ${m>bud?'':''}" ><i style="width:${Math.min(100,m/bud*100)}%;${m>bud?'background:var(--bad)':''}"></i></div>`:''}`;}
  if(k==='course'){body=f.grade||f.status==='Current'?`<div class="meta">${f.status==='Current'?'<span class="badge soon">Current</span>':''}${f.grade?`<span class="badge ok">Grade ${esc(f.grade)}</span>`:''}${f.exam?`<span class="badge">${I.cal}${fmtShort(f.exam)}</span>`:''}</div>`:''}
  const cl=c.cl.length?`<span class="badge ${c.cl.every(x=>x.d)?'ok':''}">${I.list}${c.cl.filter(x=>x.d).length}/${c.cl.length}</span>`:'';

  return `<div class="card ${c.done?'isdone':''}" draggable="true" data-id="${c.id}">${chips}<div class="crow">${chk?`<button class="chk ${c.done?'on':''}" data-chk="${c.id}" aria-label="Toggle done">${I.check}</button>`:''}<div class="ct">${esc(c.t)}</div></div>${body}${metaBits.trim()?`<div class="meta">${metaBits}</div>`:''}</div>`;

function moveCard(c,listId,beforeId){
  const b=B(c.b),l=b.lists.find(x=>x.id===listId);
  S.cards=S.cards.filter(x=>x!==c);c.l=listId;
  if(b.kind!=='course'&&b.kind!=='debt'&&b.kind!=='goal')c.done=!!l.done;
  if(b.kind==='debt'&&l.done&&debtLeft(c)>0){/* manual clear: record the rest */ const left=debtLeft(c);(c.f.pays=c.f.pays||[]).push({date:today(),amt:left})}
  if(b.kind==='goal'&&l.done&&c.f.target)c.f.saved=Math.max(+c.f.saved||0,+c.f.target);
  const idx=beforeId?S.cards.findIndex(x=>x.id===beforeId):-1;
  if(idx>=0)S.cards.splice(idx,0,c);else S.cards.push(c);
  save();render();
}
function autoFile(c){ /* debts and goals sort themselves by balance */
  const b=B(c.b);
  if(b.kind==='debt'){const dn=b.lists.find(l=>l.done),op=b.lists.find(l=>!l.done);c.done=debtLeft(c)<=0.005;c.l=c.done?dn.id:op.id}
  if(b.kind==='goal'){const dn=b.lists.find(l=>l.done),op=b.lists.find(l=>!l.done);c.done=!!c.f.target&&(+c.f.saved||0)>=c.f.target;c.l=c.done?dn.id:op.id}
}
function toggleDone(id){
  const c=S.cards.find(x=>x.id===id),b=B(c.b);
  c.done=!c.done;
  if(b.kind==='course')c.f.status=c.done?'Passed':(c.f.status==='Passed'?'Planned':c.f.status);
  else{ const dn=b.lists.find(l=>l.done);
    if(c.done&&dn){c.l=dn.id}
    else if(!c.done&&dn&&c.l===dn.id){const op=b.lists.find(l=>!l.done);if(op)c.l=op.id}}
  save();render();
}

/* ---------- modals ---------- */
function modal(html,onClose){
  const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(s);
  const close=()=>{s.remove();document.removeEventListener('keydown',kd);onClose&&onClose()};
  const kd=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',kd);
  s.onmousedown=e=>{if(e.target===s)close()};
  s.querySelectorAll('[data-x]').forEach(b=>b.onclick=close);
  s.close=close;return s;
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function confirmBox(msg,yes){

}
function cardModal(id){

  const allLabels=[...new Set(S.cards.filter(x=>x.b===b.id).flatMap(x=>x.labels))];
  const dueLabel=k==='job'?'Date':k==='course'?'Due date (optional)':'Due date';
  const fields=()=>{
    if(k==='debt')return `<div class="three f"><div><label>Starting amount</label><input type="number" step="any" id="f_amount" value="${f.amount||''}"></div><div><label>Currency</label><select id="f_cur">${['EUR','KES','USD','GBP'].map(x=>`<option ${f.cur===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Interest / fees added</label><input type="number" step="any" id="f_extra" value="${f.extra||''}"></div></div>
      <div class="f"><label>Left to pay</label><div style="font-size:22px;font-weight:800" id="leftv">${money(debtLeft(c),f.cur)} <small style="font-weight:500;color:var(--ink3)">${f.cur!=='EUR'?'≈ '+eur(toEUR(debtLeft(c),f.cur)):''}</small></div></div>
      <div class="f"><label>Log a payment</label><div class="three"><input class="inp" type="number" step="any" id="p_amt" placeholder="Amount (${f.cur})"><input class="inp" type="number" step="any" id="p_eur" placeholder="Cost in EUR"><input class="inp" type="date" id="p_date" value="${today()}"></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:8px;text-transform:none;letter-spacing:0;font-size:13px"><input type="checkbox" id="p_tx" checked style="width:auto"> Also record it in Money</label>
      <button class="btn p sm" id="p_go" style="margin-top:8px">Add payment</button>
      <div class="pays" id="pays">${(f.pays||[]).length?(f.pays).map((p,i)=>`<div class="p"><span>${fmtDate(p.date)}</span><b>${money(p.amt,f.cur)}</b><button class="iconbtn" data-dp="${i}">${I.x}</button></div>`).join(''):'<div class="hint" style="padding:6px 0">No payments yet.</div>'}</div></div>`;
    if(k==='goal')return `<div class="two f"><div><label>Target (EUR)</label><input type="number" step="any" id="f_target" value="${f.target||''}"></div><div><label>Saved so far (EUR)</label><input type="number" step="any" id="f_saved" value="${f.saved||''}"></div></div>
      <div class="f"><label>Put money aside</label><div class="two"><input class="inp" type="number" step="any" id="g_add" placeholder="Amount (EUR)"><button class="btn p" id="g_go">Add to savings</button></div></div>`;
    if(k==='job')return `<div class="three f"><div><label>Type</label><select id="f_jtype">${['Application','Interview / Appointment','Shift'].map(x=>`<option ${f.jtype===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Hourly wage (EUR)</label><input type="number" step="any" id="f_wage" value="${f.wage||''}"></div><div><label>Hours</label><input type="number" step="any" id="f_hours" value="${f.hours||''}"></div></div><div class="hint">Estimated pay: <b>${eur((+f.hours||0)*(+f.wage||0))}</b>. Shifts in the Shift booked and Shift done lists count towards your work days.</div>`;
    if(k==='bill')return `<div class="two f"><div><label>Amount</label><input type="number" step="any" id="f_amount" value="${f.amount||''}"></div><div><label>Currency</label><select id="f_cur">${['EUR','KES','USD','GBP'].map(x=>`<option ${f.cur===x?'selected':''}>${x}</option>`).join('')}</select></div></div>`;
    if(k==='course')return `<div class="three f"><div><label>Status</label><select id="f_status">${['Planned','Current','Passed'].map(x=>`<option ${f.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Grade</label><input id="f_grade" value="${esc(f.grade)}"></div><div><label>Exam date</label><input type="date" id="f_exam" value="${f.exam||''}"></div></div>`;
    if(k==='fun'){const ss=(f.sessions||[]).slice().reverse().slice(0,8);return `<div class="two f"><div><label>Weekly limit (hours)</label><input type="number" step="any" id="f_budget" value="${f.budget||''}" placeholder="Leave empty for none"></div><div><label>This week</label><div style="font-size:22px;font-weight:800;padding-top:4px">${hm(funMin(c))}</div></div></div>
      <div class="f"><label>Log time played or listened</label><div class="three"><input class="inp" type="number" id="fm" placeholder="Minutes"><input class="inp" type="date" id="fd" value="${today()}"><button class="btn p" id="fgo">Log</button></div>
      <div class="pays">${ss.length?ss.map((x)=>`<div class="p"><span>${fmtDate(x.date)}</span><b>${hm(x.min)}</b><button class="iconbtn" data-fs="${f.sessions.indexOf(x)}">${I.x}</button></div>`).join(''):'<div class="hint" style="padding:6px 0">Nothing logged yet.</div>'}</div></div>`}
    if(k==='book')return `<div class="f"><label>Author</label><input id="f_author" value="${esc(f.author||'')}"></div>`;
    return '';
  };
  const s=modal(`<button class="iconbtn x" data-x aria-label="Close">${I.x}</button>
    <div class="hint" style="margin-bottom:2px">${esc(b.name)}</div>
    <input class="titlein" id="m_t" value="${esc(c.t)}">
    <div class="two f"><div><label>Move to list</label><select id="m_l">${b.lists.map(l=>`<option value="${l.id}" ${l.id===c.l?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div><label>${dueLabel}</label><input type="date" id="m_due" value="${c.due||''}"></div></div>
    ${fields()}
    <div class="f"><label>Labels</label><div class="tag-row" id="m_labs"></div><input id="m_newlab" placeholder="Type a label and press Enter" style="margin-top:4px"></div>
    <div class="f"><label>Notes</label><textarea id="m_d" placeholder="Anything worth remembering">${esc(c.d)}</textarea></div>
    <div class="f"><label>Checklist</label><div id="m_cl"></div><div style="display:flex;gap:6px;margin-top:4px"><input class="inp" id="m_newcl" placeholder="Add an item"><button class="btn sm" id="m_addcl">Add</button></div></div>
    <div class="foot"><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn d" id="m_del">Delete card</button><button class="btn" id="m_td">Send to Todoist</button></span><button class="btn p" data-x>Done</button></div>`,()=>render());
  const q=sel=>s.querySelector(sel);
  const num=id=>{const v=q(id).value;return v===''?0:+v};
  const drawLabs=()=>{const set=[...new Set([...allLabels,...c.labels])];q('#m_labs').innerHTML=set.map(l=>`<button class="pickchip ${c.labels.includes(l)?'':'off'}" data-lab="${esc(l)}" style="background:${hashCol(l)}">${esc(l)}</button>`).join('');
    q('#m_labs').querySelectorAll('[data-lab]').forEach(el=>el.onclick=()=>{const l=el.dataset.lab;c.labels=c.labels.includes(l)?c.labels.filter(x=>x!==l):[...c.labels,l];save();drawLabs()})};
  const drawCl=()=>{q('#m_cl').innerHTML=c.cl.map((x,i)=>`<div class="cli ${x.d?'d':''}"><button class="chk ${x.d?'on':''}" data-ci="${i}">${I.check}</button><input type="text" data-ct="${i}" value="${esc(x.t)}"><button class="iconbtn" data-cd="${i}">${I.x}</button></div>`).join('');
    q('#m_cl').querySelectorAll('[data-ci]').forEach(el=>el.onclick=()=>{c.cl[+el.dataset.ci].d=!c.cl[+el.dataset.ci].d;save();drawCl()});
    q('#m_cl').querySelectorAll('[data-ct]').forEach(el=>el.oninput=()=>{c.cl[+el.dataset.ct].t=el.value;save()});
    q('#m_cl').querySelectorAll('[data-cd]').forEach(el=>el.onclick=()=>{c.cl.splice(+el.dataset.cd,1);save();drawCl()})};
  drawLabs();drawCl();
  q('#m_t').oninput=e=>{c.t=e.target.value||'Untitled';save()};
  q('#m_d').oninput=e=>{c.d=e.target.value;save()};
  q('#m_due').onchange=e=>{c.due=e.target.value;save()};
  q('#m_l').onchange=e=>{const l=b.lists.find(x=>x.id===e.target.value);c.l=l.id;if(k!=='course'&&k!=='debt'&&k!=='goal')c.done=!!l.done;save()};
  q('#m_newlab').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){const v=e.target.value.trim();if(!c.labels.includes(v))c.labels.push(v);allLabels.push(v);e.target.value='';save();drawLabs()}};
  const addCl=()=>{const i=q('#m_newcl');if(i.value.trim()){c.cl.push({t:i.value.trim(),d:false});i.value='';save();drawCl()}};
  q('#m_addcl').onclick=addCl;q('#m_newcl').onkeydown=e=>{if(e.key==='Enter')addCl()};
  q('#m_td').onclick=()=>{const u='https://todoist.com/add?content='+encodeURIComponent(c.t)+(c.due?'&date='+c.due:'');window.open(u,'_blank','noopener')};
  q('#m_del').onclick=()=>{s.close();S.cards=S.cards.filter(x=>x!==c);save();render();toast('Card deleted')};
  const bind=(id,key,conv)=>{const el=q('#'+id);if(!el)return;el.oninput=el.onchange=()=>{f[key]=conv?conv(el.value):el.value;if(k==='debt'||k==='goal')autoFile(c);save();if(k==='debt'){q('#leftv').innerHTML=`${money(debtLeft(c),f.cur)} <small style="font-weight:500;color:var(--ink3)">${f.cur!=='EUR'?'≈ '+eur(toEUR(debtLeft(c),f.cur)):''}</small>`}}};
  const nv=v=>v===''?0:+v;
  ['amount','extra','target','saved','wage','hours','budget'].forEach(n=>bind('f_'+n,n,nv));
  ['cur','jtype','status','grade','exam','author'].forEach(n=>bind('f_'+n,n));
  if(k==='course'){q('#f_status').addEventListener('change',()=>{c.done=f.status==='Passed';save()})}
  if(k==='debt'){
    q('#p_go').onclick=()=>{const a=num('#p_amt');if(!a)return;f.pays=f.pays||[];const date=q('#p_date').value||today();f.pays.push({date,amt:a});
      if(q('#p_tx').checked){const e=num('#p_eur')||toEUR(a,f.cur);S.tx.push({id:uid('t'),date,type:'out',cat:'Debt repayment',desc:`${c.t} repayment`,amt:+e.toFixed(2),cur:'EUR',status:'Paid',method:'',note:f.cur!=='EUR'?`${money(a,f.cur)} received by the lender`:''})}
      autoFile(c);save();s.close();cardModal(c.id);toast('Payment added')};
    q('#pays').querySelectorAll('[data-dp]').forEach(el=>el.onclick=()=>{f.pays.splice(+el.dataset.dp,1);autoFile(c);save();s.close();cardModal(c.id)});
  }
  if(k==='fun'){
    q('#fgo').onclick=()=>{const m=num('#fm');if(!m)return;(f.sessions=f.sessions||[]).push({date:q('#fd').value||today(),min:m});save();s.close();cardModal(c.id);toast('Logged')};
    s.querySelectorAll('[data-fs]').forEach(el=>el.onclick=()=>{f.sessions.splice(+el.dataset.fs,1);save();s.close();cardModal(c.id)});}
  if(k==='goal'){q('#g_go').onclick=()=>{const a=num('#g_add');if(!a)return;f.saved=(+f.saved||0)+a;autoFile(c);save();s.close();cardModal(c.id);toast('Savings updated')}}
}

function txModal(id){
  const t=id?S.tx.find(x=>x.id===id):{id:null,date:today(),type:'out',cat:'Food',desc:'',amt:'',cur:'EUR',status:'Paid',method:'',note:''};
  const d={...t};
  const s=modal(`<button class="iconbtn x" data-x aria-label="Close">${I.x}</button><h2>${id?'Edit entry':'Add money'}</h2>
    <div class="seg" style="background:#e3e9ee;margin:10px 0"><button type="button" data-ty="out" style="color:var(--ink)">Money out</button><button type="button" data-ty="in" style="color:var(--ink)">Money in</button></div>
    <div class="f"><input class="inp bigamt" id="x_amt" type="number" step="any" inputmode="decimal" placeholder="0.00" value="${d.amt}"></div>
    <div class="two f"><div><label>Currency</label><select id="x_cur">${['EUR','KES','USD','GBP'].map(x=>`<option ${d.cur===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Date</label><input type="date" id="x_date" value="${d.date}"></div></div>
    <div class="f"><label>Category</label><div class="catpick" id="x_cats"></div></div>
    <div class="f"><label>What was it for</label><input id="x_desc" placeholder="e.g. Groceries at ALDI" value="${esc(d.desc)}"></div>
    <div class="two f"><div><label>Status</label><select id="x_status"><option ${d.status==='Paid'?'selected':''}>Paid</option><option ${d.status==='Planned'?'selected':''}>Planned</option></select></div><div><label>Account</label><input id="x_method" list="accts" placeholder="Wise, N26, cash" value="${esc(d.method)}"><datalist id="accts"><option>Wise<option>N26<option>Targobank<option>ING<option>Klarna<option>Cash<option>M-Pesa</datalist></div></div>
    <div class="foot">${id?'<button class="btn d" id="x_del">Delete</button>':'<span></span>'}<span style="display:flex;gap:8px"><button class="btn" data-x>Cancel</button><button class="btn p" id="x_save">Save</button></span></div>`);
  const q=sel=>s.querySelector(sel);
  const drawType=()=>{s.querySelectorAll('[data-ty]').forEach(b=>{const on=b.dataset.ty===d.type;b.classList.toggle('on',on)});
    const cats=d.type==='in'?['Wages','Other income','Savings']:CATS.filter(c=>c!=='Wages'&&c!=='Other income');
    if(!cats.includes(d.cat))d.cat=cats[0];
    q('#x_cats').innerHTML=cats.map(c=>`<button type="button" class="${d.cat===c?'on':''}" data-c="${c}">${c}</button>`).join('');
    q('#x_cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{d.cat=b.dataset.c;drawType()})};
  s.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{d.type=b.dataset.ty;drawType()});
  drawType();if(!id)q('#x_amt').focus();
  q('#x_save').onclick=()=>{const a=+q('#x_amt').value;if(!a||a<=0){q('#x_amt').focus();toast('Enter an amount');return}
    Object.assign(d,{amt:a,cur:q('#x_cur').value,date:q('#x_date').value||today(),desc:q('#x_desc').value.trim()||d.cat,status:q('#x_status').value,method:q('#x_method').value.trim()});
    if(id)Object.assign(t,d);else{d.id=uid('t');S.tx.push(d)}
    save();s.close();render();toast(id?'Saved':'Added')};
  if(id)q('#x_del').onclick=()=>{S.tx=S.tx.filter(x=>x!==t);save();s.close();render();toast('Deleted')};
  s.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')q('#x_save').click()});
}

function settingsModal(){
  const st=S.settings;
  const s=modal(`<button class="iconbtn x" data-x aria-label="Close">${I.x}</button><h2>Settings and backup</h2>
    <div class="two f"><div><label>Your name</label><input id="s_name" value="${esc(st.name)}"></div><div><label>KSh per €1</label><input id="s_rate" type="number" step="any" value="${st.rate}"></div></div>
    <div class="two f"><div><label>Moving date</label><input id="s_move" type="date" value="${st.moveDate}"></div><div><label>Yearly work-day limit</label><input id="s_lim" type="number" value="${st.workLimit}"></div></div>
    <div class="f"><label>Opening cash balance (EUR)</label><input id="s_open" type="number" step="any" value="${st.opening||''}"><div class="hint" style="margin-top:4px">Cash on hand = this number plus every paid entry in Money.</div></div>
    <div class="f"><label>Backup</label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="b_exp">Download backup (JSON)</button><button class="btn" id="b_csv">Money as CSV</button><button class="btn" id="b_imp">Restore from backup</button><input type="file" id="b_file" accept=".json" hidden></div>
    <div class="hint" style="margin-top:6px">${storageOK?'Your data is stored in this browser on this device. A weekly backup download is a good habit.':'This view cannot store data. Download a backup before closing.'}</div></div>
    <div class="foot"><button class="btn d" id="b_reset">Reset to starting data</button><button class="btn p" id="s_save">Save</button></div>`);
  const q=x=>s.querySelector(x);
  q('#s_save').onclick=()=>{Object.assign(st,{name:q('#s_name').value||'Sharman',rate:+q('#s_rate').value||st.rate,moveDate:q('#s_move').value||st.moveDate,workLimit:+q('#s_lim').value||140,opening:+q('#s_open').value||0});save();s.close();render()};
  const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()};
  q('#b_exp').onclick=()=>dl(`sharmans-project-${today()}.json`,JSON.stringify(S,null,1),'application/json');
  q('#b_csv').onclick=()=>dl(`money-${today()}.csv`,'Date,Type,Category,Description,Amount,Currency,Status,Account\n'+S.tx.map(t=>[t.date,t.type,t.cat,'"'+String(t.desc).replace(/"/g,'""')+'"',t.amt,t.cur,t.status,t.method].join(',')).join('\n'),'text/csv');
  q('#b_imp').onclick=()=>q('#b_file').click();
  q('#b_file').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.boards||!j.cards)throw 0;S=j;save();s.close();render();toast('Backup restored')}catch(x){toast('That file is not a valid backup')}};r.readAsText(fl)};
  q('#b_reset').onclick=()=>{s.close();confirmBox('Replace everything with the starting data? Download a backup first if you want to keep your changes.',()=>{S=JSON.parse(JSON.stringify(SEED));save();view='home';render()})};
}

load();render();
</script>
</body>
</html>
